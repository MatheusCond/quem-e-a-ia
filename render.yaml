# Blueprint do Render: o jogo inteiro num serviço web gratuito + Postgres
# gratuito. Passo a passo em docs/HOSPEDAGEM.md.
services:
  - type: web
    name: quem-e-a-ia
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/standalone/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quem-e-a-ia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BYOK_ENCRYPTION_KEY
        generateValue: true
      # O Render pede o valor no painel. Vazio = respostas prontas do
      # FakeLlmProvider (custo zero). Nunca coloque a chave neste arquivo.
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: AI_DAILY_MAX_CALLS
        value: '400'

databases:
  - name: quem-e-a-ia-db
    plan: free
    databaseName: quem_e_a_ia
    user: quem
