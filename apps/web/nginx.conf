# Serve o front-end e encaminha a API e o WebSocket para o container "api".
# Assim o navegador fala com uma origem só (sem CORS) e o worker fica
# inacessível de fora.
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 2m;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  # Arquivos com hash no nome podem ficar em cache para sempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Rotas do React Router (/sala/ABC123) caem no index.html.
  location / {
    try_files $uri /index.html;
  }
}
